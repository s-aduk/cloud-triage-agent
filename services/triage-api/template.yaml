AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Cloud Triage Agent API Service

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs20.x
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps
        LOG_LEVEL: info
        POWERTOOLS_SERVICE_NAME: cloud-triage-api
        POWERTOOLS_METRICS_NAMESPACE: CloudTriageApi
        KNOWLEDGE_BASE_URI: ${{KnowledgeBaseUri}}

Resources:
  TriageApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cloud-triage-api-${AWS::StackName}
      Description: API handler for cloud incident triage (baseline and agent workflows)
      CodeUri: src/
      Handler: src/handlers/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: "*"
      Events:
        BaselineApi:
          Type: Api
          Properties:
            Path: /baseline
            Method: post
            RestApiId: !Ref TriageApi
        AgentApi:
          Type: Api
          Properties:
            Path: /agent
            Method: post
            RestApiId: !Ref TriageApi

  TriageApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub cloud-triage-api-${AWS::StackName}
      StageName: prod
      EndpointConfiguration: REGIONAL
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

  # Knowledge Base as a simple resource (in real implementation, this might be S3 or DynamoDB)
  KnowledgeBase:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: !Sub cloud-triage-knowledge-base-${AWS::StackName}
      PrimaryKey:
        Name: id
        Type: String

Outputs:
  TriageApiUrl:
    Description: URL for the triage API
    Value: !Sub https://${TriageApi}.execute-api.${AWS::Region}.amazonaws.com/prod/
  TriageApiBaselineUrl:
    Description: URL for the baseline workflow endpoint
    Value: !Sub https://${TriageApi}.execute-api.${AWS::Region}.amazonaws.com/prod/baseline
  TriageApiAgentUrl:
    Description: URL for the agent workflow endpoint
    Value: !Sub https://${TriageApi}.execute-api.${AWS::Region}.amazonaws.com/prod/agent
  KnowledgeBaseUri:
    Description: URI for knowledge base
    Value: !GetAtt KnowledgeBase.Arn