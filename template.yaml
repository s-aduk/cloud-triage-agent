AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Cloud Triage Agent - Helps engineering teams triage cloud incidents faster

# SAM Parameters for configuration
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment
  GeminiApiKey:
    Type: String
    NoEcho: true
    Description: >
      Google Gemini API key (free tier, no credit card — get one at
      https://aistudio.google.com/apikey). Used by both workflows instead
      of Bedrock; see docs/changelog.md for why this project moved off
      Bedrock (account-level AWS restrictions blocked model access/quota
      for a free-tier account). Passed as a SecureString via NoEcho so it
      doesn't appear in the CloudFormation console/CLI output — for a real
      production deployment, prefer Secrets Manager or SSM Parameter Store
      over a plain parameter.
  GeminiModel:
    Type: String
    Default: gemini-3.5-flash-lite
    Description: >
      Gemini model ID used by both workflows. Updated from gemini-2.5-flash-lite
      to gemini-3.5-flash-lite — all of this project's verified real-run
      results (see docs/changelog.md) are against 3.5, and 2.5-flash-lite's
      free daily quota proved unreliable on the account this was tested
      with (a flat ~20/day cap, not the ~1,000/day documented default).
      2.5-flash-lite remains supported as a fallback (geminiClient.ts
      picks the correct thinking-config field for either generation) if
      3.x isn't available on your account.

# Global settings for all functions
Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs24.x
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: info
        POWERTOOLS_SERVICE_NAME: cloud-triage-agent
        POWERTOOLS_METRICS_NAMESPACE: CloudTriageAgent
        GEMINI_API_KEY: !Ref GeminiApiKey
        GEMINI_MODEL: !Ref GeminiModel

Resources:
  # Baseline workflow: single Gemini call, no retrieval, no verification.
  BaselineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cloud-triage-agent-baseline-${Environment}
      Description: Baseline workflow - single-prompt incident triage via Gemini
      CodeUri: services/triage-api/
      Handler: src/handlers/baseline.BaselineHandler
      Events:
        BaselineApi:
          Type: Api
          Properties:
            Path: /baseline
            Method: post
            RestApiId: !Ref TriageApi
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/handlers/baseline.ts

  # Agent workflow: classify -> retrieve (local KB similarity) -> verify
  # (Gemini, can override the initial classification) -> summarize.
  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cloud-triage-agent-agent-${Environment}
      Description: Agent workflow - classify/retrieve/verify incident triage via Gemini
      CodeUri: services/triage-api/
      Handler: src/handlers/agent.AgentHandler
      Events:
        AgentApi:
          Type: Api
          Properties:
            Path: /agent
            Method: post
            RestApiId: !Ref TriageApi
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/handlers/agent.ts

  TriageApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub cloud-triage-agent-api-${Environment}
      StageName: prod
      EndpointConfiguration:
        Type: REGIONAL
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

Outputs:
  TriageApiUrl:
    Description: Base API URL for the frontend (NEXT_PUBLIC_API_URL) — appends /baseline or /agent itself
    Value: !Sub https://${TriageApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  TriageApiBaselineUrl:
    Description: Full URL for the baseline workflow endpoint (for direct curl testing)
    Value: !Sub https://${TriageApi}.execute-api.${AWS::Region}.amazonaws.com/prod/baseline
  TriageApiAgentUrl:
    Description: Full URL for the agent workflow endpoint (for direct curl testing)
    Value: !Sub https://${TriageApi}.execute-api.${AWS::Region}.amazonaws.com/prod/agent
  BaselineFunctionArn:
    Description: Baseline Lambda Function ARN
    Value: !GetAtt BaselineFunction.Arn
  AgentFunctionArn:
    Description: Agent Lambda Function ARN
    Value: !GetAtt AgentFunction.Arn
