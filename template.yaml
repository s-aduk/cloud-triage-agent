AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Cloud Triage Agent - Helps engineering teams triage cloud incidents faster

# SAM Parameters for configuration
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: >
      Bedrock inference profile ID for the Claude model used by both
      workflows. Must be an inference profile ID (region-prefixed), not a
      bare model ID — on-demand invocation of a bare model ID is rejected
      for current-generation Claude models. Verify the current value for
      your account/region with `aws bedrock list-inference-profiles`, and
      make sure model access is enabled in the Bedrock console
      (Model access -> Anthropic) before deploying.

# Global settings for all functions
Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs24.x
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: info
        POWERTOOLS_SERVICE_NAME: cloud-triage-agent
        POWERTOOLS_METRICS_NAMESPACE: CloudTriageAgent
        BEDROCK_MODEL_ID: !Ref BedrockModelId

Resources:
  # Baseline workflow: single Bedrock call, no retrieval, no verification.
  BaselineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cloud-triage-agent-baseline-${Environment}
      Description: Baseline workflow - single-prompt incident triage via Bedrock
      CodeUri: services/triage-api/
      Handler: src/handlers/baseline.BaselineHandler
      Policies:
        - Statement:
            - Sid: InvokeBedrockModel
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
      Events:
        BaselineApi:
          Type: Api
          Properties:
            Path: /baseline
            Method: post
            RestApiId: !Ref TriageApi
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/handlers/baseline.ts

  # Agent workflow: classify -> retrieve (local KB similarity) -> verify
  # (Bedrock, can override the initial classification) -> summarize.
  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cloud-triage-agent-agent-${Environment}
      Description: Agent workflow - classify/retrieve/verify incident triage via Bedrock
      CodeUri: services/triage-api/
      Handler: src/handlers/agent.AgentHandler
      Policies:
        - Statement:
            - Sid: InvokeBedrockModel
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
      Events:
        AgentApi:
          Type: Api
          Properties:
            Path: /agent
            Method: post
            RestApiId: !Ref TriageApi
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/handlers/agent.ts

  TriageApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub cloud-triage-agent-api-${Environment}
      StageName: prod
      EndpointConfiguration:
        Type: REGIONAL
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

Outputs:
  TriageApiUrl:
    Description: Base API URL for the frontend (NEXT_PUBLIC_API_URL) — appends /baseline or /agent itself
    Value: !Sub https://${TriageApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  TriageApiBaselineUrl:
    Description: Full URL for the baseline workflow endpoint (for direct curl testing)
    Value: !Sub https://${TriageApi}.execute-api.${AWS::Region}.amazonaws.com/prod/baseline
  TriageApiAgentUrl:
    Description: Full URL for the agent workflow endpoint (for direct curl testing)
    Value: !Sub https://${TriageApi}.execute-api.${AWS::Region}.amazonaws.com/prod/agent
  BaselineFunctionArn:
    Description: Baseline Lambda Function ARN
    Value: !GetAtt BaselineFunction.Arn
  AgentFunctionArn:
    Description: Agent Lambda Function ARN
    Value: !GetAtt AgentFunction.Arn
